<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyBibble 365 Bible Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1b365d">
</head>
<body>

  <!-- Top Header & Progress Bar -->
  <header class="app-header">
    <div class="header-top">
      <h1>DailyBibble</h1>
      <button id="menu-btn" aria-label="Open Progress Menu">☰ Menu</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
    </div>
    <div class="progress-text">
      <span id="progress-stats">Day 0 of 365 (0%)</span>
      <button id="mark-read-btn" class="unread-badge">Mark as Read</button>
    </div>
  </header>

  <!-- Day Navigation Bar -->
  <nav class="nav-bar">
    <button id="prev-day-btn">&larr; Earlier</button>
    <div class="current-day-display">
      <span id="day-number-label">Day 1</span>
      <span id="current-day-date" class="day-date-label">--</span>
    </div>
    <button id="next-day-btn">Later &rarr;</button>
  </nav>

  <!-- Main Content Area -->
  <main class="content-container">
    
    <!-- Passage Header Card & Actions Toolbar -->
    <section class="passage-card">
      <h2 id="nt-passage-title">Loading Passage...</h2>
      <div class="action-toolbar">
        <button id="btn-col-ot1" class="tool-btn">📜 OT1 (Early)</button>
        <button id="btn-col-ot2" class="tool-btn">🌿 OT2 (Late)</button>
        <button id="btn-col-nt" class="tool-btn active-col">📖 NT</button>
        <button id="btn-ai-overview" class="tool-btn">✨ AI Overview</button>
        <a id="study-link-btn" href="https://www.biblegateway.com" target="_blank" class="tool-btn" style="text-decoration: none; display: inline-flex; align-items: center;">📚 Study Guide</a>
      </div>
    </section>

    <!-- Contextual Reading Section -->
    <section class="context-section">
      <div class="context-card hidden" id="historical-context-box">
        <h3 id="context-card-title">✨ AI Passage Overview</h3>
        <div id="context-text-body">Loading context...</div>
      </div>
    </section>

    <!-- Scripture Text Display Box -->
    <section class="scripture-box">
      <div id="scripture-loading" class="spinner hidden">Loading scripture...</div>
      <div id="scripture-content">
        <p class="placeholder-instruction">Select a day or tap 'Mark as Read' to track your progress.</p>
      </div>
    </section>

  </main>

  <!-- Slide-Out 365-Day Progress Drawer (Starts closed by default) -->
  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <aside id="progress-drawer" class="drawer closed">
    <div class="drawer-header">
      <h2>Menu & Settings</h2>
      <button id="close-drawer-btn">&times;</button>
    </div>

    <!-- Drawer Settings & Configuration Panel -->
    <div class="drawer-settings-panel">
      <div class="setting-row">
        <label for="translation-select">Bible Translation</label>
        <select id="translation-select" class="drawer-select" aria-label="Select Bible Version">
          <option value="CEB">CEB</option>
          <option value="ERV">ERV</option>
          <option value="WEB">WEB</option>
          <option value="NKJV">NKJV</option>
          <option value="KJV">KJV</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="start-date-input">Plan Start Date</label>
        <div style="display: flex; gap: 6px;">
          <input type="date" id="start-date-input" class="drawer-input" title="Set plan start date" />
          <button id="jump-today-btn" class="tool-btn" style="padding: 4px 8px; font-size: 0.8rem;">Today</button>
        </div>
      </div>

      <div class="setting-row">
        <label for="jump-date-input">Jump to Date</label>
        <input type="date" id="jump-date-input" class="drawer-input" title="Jump to specific calendar date" />
      </div>

      <div class="setting-row" style="flex-direction: row; justify-content: space-between; align-items: center;">
        <span>Appearance</span>
        <button id="theme-toggle-btn" class="tool-btn" style="padding: 6px 12px;">🌙 Dark Mode</button>
      </div>
    </div>

    <div class="drawer-stats-summary">
      <p id="drawer-completed-count">Completed: 0 / 365</p>
      <button id="reset-progress-btn" class="danger-btn">Reset Plan</button>
    </div>
    
    <div class="grid-container" id="days-grid">
      <!-- Generated dynamically by JS -->
    </div>
  </aside>

  <!-- Scripts -->
  <script src="plan-part1.js"></script>
  <script src="plan-part2a.js"></script>
  <script src="plan-part2b.js"></script>
  <script src="context-data.js"></script>
  <script src="app-core.js"></script>
  <script src="app-reader.js"></script>
</body>
</html>
